name: d_rocket_builder
description: build_runner code generation for d_rocket serializers, REST clients, ORM metadata, migrations, realtime clients, and model-driven forms.
version: 2.2.5

repository: https://github.com/torogoz-tech/d_rocket_builder
homepage: https://github.com/torogoz-tech/d_rocket_builder
issue_tracker: https://github.com/torogoz-tech/d_rocket_builder/issues
documentation: https://github.com/torogoz-tech/d_rocket_builder/blob/main/README.md

topics:
  - codegen
  - build-runner
  - d-rocket
  - source-gen

environment:
  sdk: ^3.6.0

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  d_rocket: ^2.2.3
  d_rocket_lints: ^2.2.2
  # 2.2.3 — pinned Analyzer 13.0.0 in
  # lockstep with `d_rocket_lints` and
  # analysis_server_plugin 0.3.15.
  analyzer: 13.0.0
  build: ^4.0.0
  source_gen: ^4.0.0
  path: ^1.9.0
  meta: ^1.12.0
  glob: ^2.1.3

dev_dependencies:
  build_runner: ^2.4.13
  lints: ^6.0.0
  test: ^1.31.2
